[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "busytoggl"
version = "0.1.0"
description = "Control a Toggl Track timer from a BUSY Bar"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
busytoggl = "busytoggl.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
